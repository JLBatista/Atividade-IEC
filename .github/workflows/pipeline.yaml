name: Pipeline de Teste

on:
  push:
    branches: [ "main" ]

jobs:
  teste:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código de Repositório 
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: npm install

      - name: Executar testes
        run: npm test

  test:
    runs-on: ubuntu-latest
    steps:
      - run: pytest
  
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy realizado"

name: Pipeline de Teste

on:
  push:
    branches: [ "main"]

jobs:
  teste:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Código de Repositório 
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-phyton@v5
      with:
       phyton-version:'3.12'

    steps:
     - name: Instalar dependências
       run: npm install

     - name: Executar testes
       run: npm test